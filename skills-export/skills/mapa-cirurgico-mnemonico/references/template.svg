<!--
  Template SVG do mapa cirúrgico mnemônico.
  ViewBox 720 x 920. Cores hex fixas (ver cores.md).
  Substituir os placeholders {{...}} pelos conteúdos da cirurgia.

  Estrutura fixa:
    - Header navy band em [0, 0..62]
    - Coluna esquerda (20..420): 5 tempos cirúrgicos
    - Coluna direita  (440..700): 4 estruturas-tabu + regra-pearl
    - Painel inferior esquerdo (20..420): checklist
    - Painel inferior direito  (440..700): mnemônico

  Tempos 3 e 4 sempre têm borda vermelha (#c1432a) e alerta no rodapé.
-->
<svg viewBox="0 0 720 920" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="720" height="920" fill="#fafaf7" rx="12"/>

  <!-- Header -->
  <rect x="0" y="0" width="720" height="62" fill="#1f3a5f" rx="12"/>
  <rect x="0" y="50" width="720" height="12" fill="#1f3a5f"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#ffffff">{{CIRURGIA}} · mapa mnemônico</text>
  <text x="20" y="50" font-size="11" font-weight="500" fill="#cfe1f7" letter-spacing="1.2">5 TEMPOS CIRÚRGICOS  ·  4 ESTRUTURAS-TABU</text>

  <!-- COLUNA ESQUERDA — Sequência operatória -->
  <text x="20" y="92" font-size="12" font-weight="700" fill="#1f3a5f" letter-spacing="1">SEQUÊNCIA OPERATÓRIA</text>
  <line x1="20" y1="98" x2="420" y2="98" stroke="#1f3a5f" stroke-width="1"/>

  <!-- T1 ACESSO (neutro) -->
  <rect x="20" y="110" width="400" height="78" rx="8" fill="#ffffff" stroke="#d4d4d0" stroke-width="1"/>
  <circle cx="50" cy="149" r="20" fill="#2b6cb0"/>
  <text x="50" y="157" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">1</text>
  <text x="82" y="132" font-size="14" font-weight="700" fill="#1a1a1a">{{T1_TITULO}}</text>
  <text x="82" y="151" font-size="12" fill="#333333">{{T1_LINHA_1}}</text>
  <text x="82" y="167" font-size="12" fill="#333333">{{T1_LINHA_2}}</text>
  <text x="82" y="183" font-size="12" fill="#333333">{{T1_LINHA_3}}</text>
  <line x1="50" y1="188" x2="50" y2="200" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- T2 EXPOSIÇÃO (neutro) -->
  <rect x="20" y="200" width="400" height="78" rx="8" fill="#ffffff" stroke="#d4d4d0" stroke-width="1"/>
  <circle cx="50" cy="239" r="20" fill="#2b6cb0"/>
  <text x="50" y="247" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">2</text>
  <text x="82" y="222" font-size="14" font-weight="700" fill="#1a1a1a">{{T2_TITULO}}</text>
  <text x="82" y="241" font-size="12" fill="#333333">{{T2_LINHA_1}}</text>
  <text x="82" y="257" font-size="12" fill="#333333">{{T2_LINHA_2}}</text>
  <text x="82" y="273" font-size="12" fill="#333333">{{T2_LINHA_3}}</text>
  <line x1="50" y1="278" x2="50" y2="290" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- T3 — CRÍTICO (warn) -->
  <rect x="20" y="290" width="400" height="86" rx="8" fill="#fff5f0" stroke="#c1432a" stroke-width="1.5"/>
  <circle cx="50" cy="333" r="20" fill="#2b6cb0"/>
  <text x="50" y="341" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">3</text>
  <text x="82" y="312" font-size="14" font-weight="700" fill="#1a1a1a">{{T3_TITULO}}</text>
  <text x="82" y="331" font-size="12" fill="#333333">{{T3_LINHA_1}}</text>
  <text x="82" y="347" font-size="12" fill="#333333">{{T3_LINHA_2}}</text>
  <text x="82" y="367" font-size="11" font-weight="700" fill="#c1432a">⚠ {{T3_ALERTA}}</text>
  <line x1="50" y1="376" x2="50" y2="388" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- T4 — CRÍTICO (warn) -->
  <rect x="20" y="388" width="400" height="100" rx="8" fill="#fff5f0" stroke="#c1432a" stroke-width="1.5"/>
  <circle cx="50" cy="437" r="20" fill="#2b6cb0"/>
  <text x="50" y="445" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">4</text>
  <text x="82" y="410" font-size="14" font-weight="700" fill="#1a1a1a">{{T4_TITULO}}</text>
  <text x="82" y="429" font-size="12" fill="#333333">{{T4_LINHA_1}}</text>
  <text x="82" y="445" font-size="12" fill="#333333">{{T4_LINHA_2}}</text>
  <text x="82" y="461" font-size="12" fill="#333333">{{T4_LINHA_3}}</text>
  <text x="82" y="481" font-size="11" font-weight="700" fill="#c1432a">⚠ {{T4_ALERTA}}</text>
  <line x1="50" y1="488" x2="50" y2="500" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- T5 LIBERAÇÃO (neutro) -->
  <rect x="20" y="500" width="400" height="82" rx="8" fill="#ffffff" stroke="#d4d4d0" stroke-width="1"/>
  <circle cx="50" cy="541" r="20" fill="#2b6cb0"/>
  <text x="50" y="549" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">5</text>
  <text x="82" y="522" font-size="14" font-weight="700" fill="#1a1a1a">{{T5_TITULO}}</text>
  <text x="82" y="541" font-size="12" fill="#333333">{{T5_LINHA_1}}</text>
  <text x="82" y="557" font-size="12" fill="#333333">{{T5_LINHA_2}}</text>
  <text x="82" y="573" font-size="12" fill="#333333">{{T5_LINHA_3}}</text>

  <!-- COLUNA DIREITA — Estruturas-tabu -->
  <text x="440" y="92" font-size="12" font-weight="700" fill="#c1432a" letter-spacing="1">ESTRUTURAS-TABU</text>
  <line x1="440" y1="98" x2="700" y2="98" stroke="#c1432a" stroke-width="1"/>

  <!-- Tabu 1 -->
  <rect x="440" y="110" width="260" height="98" rx="8" fill="#ffffff" stroke="#c1432a" stroke-width="1.3"/>
  <circle cx="466" cy="136" r="14" fill="#c1432a"/>
  <text x="466" y="141" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
  <text x="488" y="141" font-size="13" font-weight="700" fill="#1a1a1a">{{TABU1_TITULO}}</text>
  <text x="452" y="163" font-size="11" fill="#333333">{{TABU1_LINHA_1}}</text>
  <text x="452" y="180" font-size="11" fill="#333333">{{TABU1_LINHA_2}}</text>
  <text x="452" y="197" font-size="11" fill="#333333">{{TABU1_LINHA_3}}</text>

  <!-- Tabu 2 -->
  <rect x="440" y="220" width="260" height="98" rx="8" fill="#ffffff" stroke="#c1432a" stroke-width="1.3"/>
  <circle cx="466" cy="246" r="14" fill="#c1432a"/>
  <text x="466" y="251" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
  <text x="488" y="251" font-size="13" font-weight="700" fill="#1a1a1a">{{TABU2_TITULO}}</text>
  <text x="452" y="273" font-size="11" fill="#333333">{{TABU2_LINHA_1}}</text>
  <text x="452" y="290" font-size="11" fill="#333333">{{TABU2_LINHA_2}}</text>
  <text x="452" y="307" font-size="11" fill="#333333">{{TABU2_LINHA_3}}</text>

  <!-- Tabu 3 -->
  <rect x="440" y="330" width="260" height="98" rx="8" fill="#ffffff" stroke="#c1432a" stroke-width="1.3"/>
  <circle cx="466" cy="356" r="14" fill="#c1432a"/>
  <text x="466" y="361" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
  <text x="488" y="361" font-size="13" font-weight="700" fill="#1a1a1a">{{TABU3_TITULO}}</text>
  <text x="452" y="383" font-size="11" fill="#333333">{{TABU3_LINHA_1}}</text>
  <text x="452" y="400" font-size="11" fill="#333333">{{TABU3_LINHA_2}}</text>
  <text x="452" y="417" font-size="11" fill="#333333">{{TABU3_LINHA_3}}</text>

  <!-- Tabu 4 -->
  <rect x="440" y="440" width="260" height="86" rx="8" fill="#ffffff" stroke="#c1432a" stroke-width="1.3"/>
  <circle cx="466" cy="466" r="14" fill="#c1432a"/>
  <text x="466" y="471" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
  <text x="488" y="471" font-size="13" font-weight="700" fill="#1a1a1a">{{TABU4_TITULO}}</text>
  <text x="452" y="493" font-size="11" fill="#333333">{{TABU4_LINHA_1}}</text>
  <text x="452" y="510" font-size="11" fill="#333333">{{TABU4_LINHA_2}}</text>

  <!-- Regra dos rentes (caixa navy) -->
  <rect x="440" y="540" width="260" height="106" rx="8" fill="#1f3a5f"/>
  <text x="452" y="562" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">{{REGRA_TITULO}}</text>
  <text x="452" y="584" font-size="11" fill="#cfe1f7">{{REGRA_LINHA_1}}</text>
  <text x="452" y="602" font-size="11" fill="#cfe1f7">{{REGRA_LINHA_2}}</text>
  <text x="452" y="620" font-size="11" fill="#cfe1f7">{{REGRA_LINHA_3}}</text>
  <text x="452" y="638" font-size="11" font-style="italic" fill="#ffd89e">"{{REGRA_PEARL}}"</text>

  <!-- CHECKLIST (painel inferior esquerdo) -->
  <text x="20" y="612" font-size="12" font-weight="700" fill="#1f3a5f" letter-spacing="1">CHECKLIST MENTAL ANTES DE FECHAR</text>
  <line x1="20" y1="618" x2="420" y2="618" stroke="#1f3a5f" stroke-width="1"/>
  <rect x="20" y="630" width="400" height="220" rx="8" fill="#ffffff" stroke="#d4d4d0" stroke-width="1"/>
  <text x="36" y="654" font-size="12" fill="#1a1a1a">☐  {{CHECK_1}}</text>
  <text x="36" y="676" font-size="12" fill="#1a1a1a">☐  {{CHECK_2}}</text>
  <text x="36" y="698" font-size="12" fill="#1a1a1a">☐  {{CHECK_3}}</text>
  <text x="36" y="720" font-size="12" fill="#1a1a1a">☐  {{CHECK_4}}</text>
  <text x="36" y="742" font-size="12" fill="#1a1a1a">☐  {{CHECK_5}}</text>
  <text x="36" y="764" font-size="12" fill="#1a1a1a">☐  {{CHECK_6}}</text>
  <text x="36" y="786" font-size="12" fill="#1a1a1a">☐  {{CHECK_7}}</text>
  <line x1="36" y1="798" x2="404" y2="798" stroke="#e5e5e5"/>
  <text x="36" y="818" font-size="11" font-weight="700" fill="#c1432a">{{POS_OP_1}}</text>
  <text x="36" y="838" font-size="11" font-weight="700" fill="#c1432a">{{POS_OP_2}}</text>

  <!-- MNEMÔNICO (painel inferior direito) -->
  <rect x="440" y="660" width="260" height="190" rx="8" fill="#fffbe6" stroke="#d4b94a" stroke-width="1.3"/>
  <text x="452" y="682" font-size="12" font-weight="700" fill="#7a5b00" letter-spacing="0.8">{{MNEMONICO_TITULO}}</text>
  <text x="452" y="706" font-size="12" fill="#1a1a1a">{{MN_LINHA_1}}</text>
  <text x="452" y="724" font-size="12" fill="#1a1a1a">{{MN_LINHA_2}}</text>
  <text x="452" y="742" font-size="12" fill="#1a1a1a">{{MN_LINHA_3}}</text>
  <text x="452" y="760" font-size="12" fill="#1a1a1a">{{MN_LINHA_4}}</text>
  <text x="452" y="778" font-size="12" fill="#1a1a1a">{{MN_LINHA_5}}</text>
  <line x1="452" y1="792" x2="688" y2="792" stroke="#d4b94a"/>
  <text x="452" y="812" font-size="11" font-style="italic" fill="#5a4400">"{{MN_FRASE_LINHA_1}}</text>
  <text x="452" y="828" font-size="11" font-style="italic" fill="#5a4400">{{MN_FRASE_LINHA_2}}"</text>

  <!-- Footer -->
  <text x="20" y="895" font-size="10" fill="#666666">{{FOOTER_LEFT}}</text>
  <text x="700" y="895" text-anchor="end" font-size="10" fill="#666666">{{FOOTER_RIGHT}}</text>
</svg>
